name: Build Kivy Test APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git unzip zip \
          libffi-dev libssl-dev autoconf libtool pkg-config \
          zlib1g-dev libncurses-dev libsdl2-dev

    - name: Install buildozer
      run: |
        python -m pip install --upgrade pip
        pip install "buildozer==1.5.0" "cython==0.29.36"

    - name: Build APK
      run: |
        set -o pipefail
        buildozer -v android debug 2>&1 | tee build_log.txt

    - name: Upload log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-log
        path: build_log.txt
        if-no-files-found: warn

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kivy-test-apk
        path: bin/*.apk
        if-no-files-found: error
